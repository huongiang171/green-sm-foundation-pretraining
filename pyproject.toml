[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-hailing-foundation-model"
version = "0.1.0"
description = "Foundation model research project for rail-hailing user behavior."
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=17.0.0",
    "scikit-learn==1.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
