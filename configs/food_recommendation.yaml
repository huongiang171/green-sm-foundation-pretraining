# Kaggle pilot v2 recipe: linked corpus and the linked Foundation checkpoint only.
seed: 42
task: food_recommendation
freeze_foundation: true
data:
  data_version: green_sm_sim_pilot_v2
  opportunities_root: /kaggle/input/datasets/huongiang/green-sm-sim-pilot-v2/green_sm_sim_pilot_v2/green_sm_sim_linked_v2/food_opportunities
  manifest_path: /kaggle/input/datasets/huongiang/green-sm-sim-pilot-v2/green_sm_sim_pilot_v2/green_sm_sim_linked_v2/food_opportunities/manifest.json
  foundation_root: /kaggle/input/datasets/huongiang/green-sm-sim-pilot-v2/green_sm_sim_pilot_v2/green_sm_sim_linked_v2/foundation
  foundation_manifest_path: /kaggle/input/datasets/huongiang/green-sm-sim-pilot-v2/green_sm_sim_pilot_v2/green_sm_sim_linked_v2/foundation/manifest.json
  foundation_corpus: linked
  vocabulary_path: /kaggle/input/datasets/huongiang/green-sm-foundation-checkpoint/green_sm_pilot_v2_checkpoint/vocabulary.json
  expected_food_manifest_sha256: replace-with-food-manifest-sha256
  expected_foundation_manifest_sha256: replace-with-foundation-manifest-sha256
  max_tokens: 256
checkpoint:
  path: /kaggle/input/datasets/huongiang/green-sm-foundation-checkpoint/green_sm_pilot_v2_checkpoint/best.pt
  manifest_path: /kaggle/input/datasets/huongiang/green-sm-foundation-checkpoint/green_sm_pilot_v2_checkpoint/best_manifest.json
  expected_sha256: replace-with-foundation-checkpoint-sha256
ranker:
  run_dir: /kaggle/working/artifacts/food/replace-with-food-run-id
  # Fill this after training, with SHA-256 of <run_dir>/run_manifest.json, before predict.
  expected_run_manifest_sha256: replace-with-food-run-manifest-sha256
model:
  dropout: 0.1
  item_hash_buckets: 65536
  merchant_hash_buckets: 16384
training:
  device: cuda
  batch_size: 16
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.00001
  artifact_dir: /kaggle/working/artifacts/food
