# Fill the three SHA-256 placeholders from the immutable full-corpus and
# selected Foundation checkpoint manifests before invoking validate/train.
seed: 42
task: ad_optimization
freeze_foundation: true
data:
  data_version: green_sm_sim_full_v1
  corpus: linked
  opportunities_root: /kaggle/input/datasets/huongiang/green-sm-sim-full/green_sm_sim_full_v1/green_sm_sim_linked_v1/ads_opportunities
  manifest_path: /kaggle/input/datasets/huongiang/green-sm-sim-full/green_sm_sim_full_v1/green_sm_sim_linked_v1/ads_opportunities/manifest.json
  foundation_root: /kaggle/input/datasets/huongiang/green-sm-sim-full/green_sm_sim_full_v1/green_sm_sim_linked_v1/foundation
  foundation_manifest_path: /kaggle/input/datasets/huongiang/green-sm-sim-full/green_sm_sim_full_v1/green_sm_sim_linked_v1/foundation/manifest.json
  quality_report_path: /kaggle/input/datasets/huongiang/green-sm-sim-full/green_sm_sim_full_v1/green_sm_sim_linked_v1/reports/data_quality_report.json
  expected_ads_manifest_sha256: replace-with-full-ads-manifest-sha256
  expected_foundation_manifest_sha256: replace-with-full-foundation-manifest-sha256
  max_tokens: 256
checkpoint:
  package_root: /kaggle/input/datasets/huongiang/green-sm-full-v1-checkpoint/green_sm_full_v1_checkpoint
  expected_selected_checkpoint_sha256: replace-with-selected-foundation-checkpoint-sha256
ranker:
  run_dir: /kaggle/working/artifacts/ad_optimization/replace-with-ads-run-id
  expected_run_manifest_sha256: replace-with-ads-run-manifest-sha256
model:
  dropout: 0.1
  candidate_hash_buckets: 65536
  campaign_hash_buckets: 16384
training:
  device: cuda
  batch_size: 64
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.00001
  artifact_dir: /kaggle/working/artifacts/ad_optimization
